<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CivilStock</title>
<style>
  :root {
    --bg:#0d0d10; --panel:#16161b; --panel2:#1d1d24; --border:#282830;
    --text:#e9e9ee; --muted:#8b8b96; --up:#f0454e; --down:#4c82f7; --accent:#3182f6; --radius:14px;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-size:14px; -webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",system-ui,sans-serif; }
  .num { font-variant-numeric:tabular-nums; }
  .up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px}
  input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:.5rem .6rem;width:100%}
  input:focus,select:focus{outline:1px solid var(--accent)}
  a{color:inherit;text-decoration:none}

  header{display:flex;align-items:center;gap:1rem;padding:.7rem 1.1rem;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:rgba(13,13,16,.9);backdrop-filter:blur(8px);z-index:20}
  .logo{font-weight:800;font-size:1.05rem;letter-spacing:-.02em;cursor:pointer}
  .logo b{color:var(--accent)}
  .clock{font-size:.8rem;color:var(--muted)}
  header .spacer{flex:1}
  .acct-pick{display:flex;align-items:center;gap:.4rem}
  .acct-pick input{width:7rem}
  .wrap{max-width:1500px;margin:0 auto;padding:1rem}

  /* HOME: 세계 지도 */
  .home-h{display:flex;align-items:baseline;gap:.6rem;margin:.5rem .2rem 1rem;flex-wrap:wrap}
  .home-h h1{font-size:1.4rem;margin:0;font-weight:800;letter-spacing:-.02em}
  .maprow{display:grid;grid-template-columns:1fr 310px;gap:1rem;align-items:start}
  @media(max-width:900px){.maprow{grid-template-columns:1fr}}
  .mapwrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;overflow:auto}
  svg#map{width:100%;height:auto;display:block}
  .hex{stroke:#3a3a48;stroke-width:1.5;cursor:pointer;transition:filter .1s}
  .hex:hover{filter:brightness(1.35)}
  .hex.sel{stroke:#fff;stroke-width:3}
  .mappanel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;position:sticky;top:5rem}
  .mappanel h3{margin:.1rem 0 .5rem;font-size:1.1rem}
  .mappanel input{margin:.3rem 0}
  .mappanel .p{width:100%;padding:.6rem;margin-top:.45rem;font-weight:700;border-radius:10px;color:#fff}
  .mappanel .enter{background:var(--accent)} .mappanel .found{background:var(--up)} .mappanel .expand{background:var(--down)}
  .legend{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}
  .legend .li{display:flex;align-items:center;gap:.3rem;font-size:.78rem} .legend .sw{width:12px;height:12px;border-radius:3px}

  /* NATION: trading */
  .nation-top{display:flex;align-items:center;gap:.7rem;margin:.2rem .2rem 1rem}
  .back{background:var(--panel2);color:var(--text);padding:.4rem .7rem;font-weight:600}
  .nation-top .nm{font-size:1.25rem;font-weight:800}
  main{display:grid;grid-template-columns:1.2fr 1.6fr .9fr;gap:1rem;align-items:start}
  @media (max-width:1100px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
  .card h2{font-size:.82rem;font-weight:600;color:var(--muted);margin:0;padding:.85rem 1rem .3rem;letter-spacing:.02em}
  .mrow{display:grid;grid-template-columns:1.6rem 1fr auto auto;gap:.6rem;align-items:center;padding:.6rem 1rem;cursor:pointer;border-top:1px solid var(--border)}
  .mrow:hover{background:var(--panel2)} .mrow.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
  .tk{font-weight:700} .tag{font-size:.68rem;color:var(--muted);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:.05rem .35rem;margin-left:.35rem}
  .mrow .price{text-align:right;font-weight:600} .mrow .chg{text-align:right;min-width:4.2rem;font-size:.85rem}
  .rk{color:var(--muted);text-align:center;font-size:.85rem}

  .dhead{display:flex;align-items:baseline;gap:.7rem;padding:1rem 1rem .3rem;flex-wrap:wrap}
  .dhead .dtk{font-size:1.15rem;font-weight:800}
  .dprice{font-size:1.9rem;font-weight:800;padding:0 1rem}
  .dchg{padding:.1rem 1rem .6rem;font-weight:600}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:.3rem .8rem;padding:0 1rem 1rem;font-size:.82rem}
  .stats .s{display:flex;justify-content:space-between;border-bottom:1px dashed var(--border);padding:.25rem 0}
  .stats .s .k{color:var(--muted)}
  .dtabs{display:flex;gap:1rem;padding:.2rem 1rem;border-bottom:1px solid var(--border)}
  .dtabs button{background:none;color:var(--muted);padding:.5rem 0;font-weight:600;border-bottom:2px solid transparent}
  .dtabs button.on{color:var(--text);border-bottom-color:var(--accent)}
  svg.chart{width:100%;height:150px;display:block}
  .book{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:.5rem 1rem 1rem}
  .book .col{display:flex;flex-direction:column;gap:2px}
  .book .lvl{display:flex;justify-content:space-between;padding:.2rem .5rem;border-radius:6px;font-size:.82rem}
  .book .ask{background:color-mix(in srgb,var(--down) 12%,transparent)}
  .book .bid{background:color-mix(in srgb,var(--up) 12%,transparent)}
  .trlist{padding:.3rem 1rem 1rem;font-size:.82rem}
  .trlist .tr{display:flex;justify-content:space-between;padding:.2rem 0;border-bottom:1px solid var(--border)}

  .tabs{display:flex;gap:.3rem;padding:.6rem 1rem 0}
  .tabs button{flex:1;padding:.55rem;background:var(--panel2);color:var(--muted);font-weight:700}
  .tabs button.on.buy{background:var(--up);color:#fff} .tabs button.on.sell{background:var(--down);color:#fff}
  .ticket{padding:.8rem 1rem 1rem;display:flex;flex-direction:column;gap:.6rem}
  .seg{display:flex;gap:.3rem} .seg button{flex:1;padding:.4rem;background:var(--panel2);color:var(--muted);font-size:.82rem}
  .seg button.on{background:var(--accent);color:#fff}
  .fieldrow{display:flex;align-items:center;gap:.5rem} .fieldrow label{width:3.5rem;color:var(--muted);font-size:.8rem}
  .quick{display:flex;gap:.3rem} .quick button{flex:1;padding:.3rem;background:var(--panel2);color:var(--muted);font-size:.78rem}
  .total{display:flex;justify-content:space-between;padding:.4rem 0;border-top:1px solid var(--border)}
  .submit{padding:.85rem;font-weight:800;font-size:1rem;color:#fff}
  .submit.buy{background:var(--up)} .submit.sell{background:var(--down)}

  .net{padding:.4rem 1rem 0} .net .big{font-size:1.6rem;font-weight:800}
  .pos{display:flex;justify-content:space-between;padding:.55rem 1rem;border-top:1px solid var(--border)} .pos .r{text-align:right}

  details.tools{margin:1rem 0;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}
  details.tools>summary{padding:.8rem 1rem;cursor:pointer;font-weight:700;color:var(--muted)}
  .tools .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;padding:0 1rem 1rem}
  .tools fieldset{border:1px solid var(--border);border-radius:12px;padding:.7rem .8rem}
  .tools legend{font-size:.78rem;color:var(--muted);padding:0 .3rem}
  .tools label.f{display:block;font-size:.72rem;color:var(--muted);margin:.3rem 0 .1rem}
  .tools button.act{width:100%;margin-top:.5rem;padding:.5rem;background:var(--accent);color:#fff;font-weight:700}

  #toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);
    border-radius:10px;padding:.6rem 1rem;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;font-size:.85rem}
  #toast.show{opacity:1}
  details.log{margin:0 0 2rem} details.log pre{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.6rem;font-size:.72rem;overflow:auto;max-height:200px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="showHome()">Civil<b>Stock</b></div>
  <div class="clock" id="clock">tick —</div>
  <div class="spacer"></div>
  <div class="acct-pick"><span class="muted">플레이어</span><input id="user" value="me" onchange="switchUser()" /></div>
</header>

<!-- HOME: 세계 지도 -->
<div class="wrap" id="home">
  <div class="home-h"><h1>🌍 세계 지도</h1><span class="muted">빈 타일=건국 · 내 영토 옆=확장 · 국가 타일=입국</span></div>
  <div class="maprow">
    <div class="mapwrap"><svg id="map" viewBox="0 0 800 400"></svg><div class="legend" id="legend"></div></div>
    <aside class="mappanel" id="mappanel"><div class="muted">타일을 선택하세요</div></aside>
  </div>
</div>

<!-- NATION: 경제(증시) -->
<div class="wrap" id="nation" style="display:none">
  <div class="nation-top">
    <button class="back" onclick="showHome()">← 세계</button>
    <span class="flag">🏛️</span>
    <span class="nm" id="n_name">—</span>
    <span class="muted" id="n_meta"></span>
  </div>
  <main>
    <section class="card" style="overflow:hidden">
      <h2>증시 · 종목</h2>
      <div id="mlist"></div>
    </section>

    <section class="card" style="overflow:hidden">
      <div class="dhead"><span class="dtk" id="d_tk">—</span><span class="tag" id="d_type"></span></div>
      <div class="dprice num" id="d_price">—</div>
      <div class="dchg num" id="d_chg"></div>
      <div class="stats" id="d_stats"></div>
      <div class="dtabs"><button id="dt_chart" class="on" onclick="setDetTab('chart')">차트</button>
        <button id="dt_book" onclick="setDetTab('book')">호가</button>
        <button id="dt_trades" onclick="setDetTab('trades')">체결</button></div>
      <div id="pane_chart"><svg class="chart" id="chart" viewBox="0 0 300 150" preserveAspectRatio="none"></svg></div>
      <div id="pane_book" style="display:none"><div class="book"><div class="col" id="asks"></div><div class="col" id="bids"></div></div></div>
      <div id="pane_trades" style="display:none"><div class="trlist" id="trades"></div></div>

      <div class="tabs">
        <button id="tab_buy" class="on buy" onclick="setSide('buy')">구매</button>
        <button id="tab_sell" class="sell" onclick="setSide('sell')">판매</button>
      </div>
      <div class="ticket">
        <div class="seg"><button id="seg_limit" class="on" onclick="setType('limit')">지정가</button>
          <button id="seg_market" onclick="setType('market')">시장가</button></div>
        <div class="fieldrow" id="pricerow"><label>가격</label><input id="o_price" class="num" /></div>
        <div class="fieldrow"><label>수량</label><input id="o_qty" class="num" value="1" oninput="calcTotal()" /></div>
        <div class="quick"><button onclick="qpct(.1)">10%</button><button onclick="qpct(.25)">25%</button>
          <button onclick="qpct(.5)">50%</button><button onclick="qpct(1)">최대</button></div>
        <div class="total"><span class="muted">총 주문금액</span><span class="num" id="o_total">—</span></div>
        <button class="submit buy" id="submit" onclick="submitOrder()">구매하기</button>
      </div>
    </section>

    <section class="card">
      <h2>내 계좌</h2>
      <div class="net"><div class="muted" id="p_cur">USD</div><div class="big num" id="p_net">—</div></div>
      <div id="p_positions" style="margin-top:.5rem"></div>
    </section>
  </main>

  <details class="tools">
    <summary>⚙ 이 국가에서 발행 · 유동성 · 재무 (운영 도구)</summary>
    <div class="grid">
      <fieldset><legend>계정 만들기</legend>
        <label class="f">userId</label><input id="t_acc_id" value="me" />
        <label class="f">초기현금(minor)</label><input id="t_acc_cash" value="100000000" />
        <button class="act" onclick="tCreateAccount()">계정 생성 + 현금</button></fieldset>
      <fieldset><legend>주식 발행 (IPO)</legend>
        <label class="f">종목id</label><input id="t_eq_id" value="sec_acme" />
        <label class="f">티커</label><input id="t_eq_tk" value="ACME" />
        <label class="f">발행주식수</label><input id="t_eq_sh" value="1000000" />
        <button class="act" onclick="tIssueEquity()">발행</button></fieldset>
      <fieldset><legend>AMM 유동성</legend>
        <label class="f">종목id</label><input id="t_lp_id" value="sec_acme" />
        <label class="f">주식 넣기</label><input id="t_lp_b" value="1000" />
        <label class="f">현금 넣기(minor)</label><input id="t_lp_q" value="100000" />
        <button class="act" onclick="tLiquidity()">예치</button></fieldset>
      <fieldset><legend>채권 발행</legend>
        <label class="f">id / 티커</label><div style="display:flex;gap:.3rem"><input id="t_bd_id" value="bnd_gov" /><input id="t_bd_tk" value="GOV5Y" /></div>
        <label class="f">액면 / 금리% </label><div style="display:flex;gap:.3rem"><input id="t_bd_face" value="1000000" /><input id="t_bd_rate" value="5" /></div>
        <label class="f">만기틱 / 쿠폰주기 / 좌수</label><div style="display:flex;gap:.3rem"><input id="t_bd_mat" value="8760" /><input id="t_bd_ci" value="4380" /><input id="t_bd_u" value="1000" /></div>
        <button class="act" onclick="tIssueBond()">발행</button></fieldset>
      <fieldset><legend>ETF 발행</legend>
        <label class="f">id / 티커</label><div style="display:flex;gap:.3rem"><input id="t_etf_id" value="etf_idx" /><input id="t_etf_tk" value="IDX" /></div>
        <label class="f">구성 (id:비중, 쉼표)</label><input id="t_etf_c" value="sec_acme:1" />
        <button class="act" onclick="tIssueEtf()">발행</button></fieldset>
      <fieldset><legend>배당 / 분할</legend>
        <label class="f">종목id</label><input id="t_dv_id" value="sec_acme" />
        <label class="f">주당 배당(minor)</label><input id="t_dv_ps" value="10" />
        <button class="act" onclick="tDividend()">배당 지급</button>
        <label class="f">분할비율(정수≥2)</label><input id="t_sp_r" value="2" />
        <button class="act" onclick="tSplit()">액면분할</button></fieldset>
      <fieldset><legend>세계 틱</legend>
        <label class="f">TICK_SECRET</label><input id="t_tick_secret" placeholder="배포 시크릿" />
        <button class="act" onclick="tTick()">틱 실행</button></fieldset>
    </div>
  </details>
  <details class="log"><summary class="muted" style="cursor:pointer;padding:0 0 .4rem">응답 로그</summary><pre id="log">준비됨.</pre></details>
</div>

<div id="toast"></div>

<script>
const $=(id)=>document.getElementById(id);
const state={ user:"me", view:"home", nation:null, nationInfo:null, securities:[], selected:null, market:null, sec:null, side:"buy", otype:"limit", account:null, detTab:"chart", selTile:null };
const sym=(c)=>c==="USD"?"$":(c?c+" ":"$");
function money(minor,cur){ const n=Number(minor)/100; if(!isFinite(n)) return String(minor); return sym(cur)+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function bigMoney(minor,cur){ const n=Number(minor)/100; if(!isFinite(n)) return String(minor); if(n>=1e9) return sym(cur)+(n/1e9).toFixed(2)+"B"; if(n>=1e6) return sym(cur)+(n/1e6).toFixed(2)+"M"; if(n>=1e3) return sym(cur)+(n/1e3).toFixed(1)+"K"; return money(minor,cur); }
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2600); }
function logJson(l,d){ $("log").textContent=l+"\n"+JSON.stringify(d,null,2); }
async function api(method,path,body,headers){ const r=await fetch(path,{method,headers:{"content-type":"application/json",...(headers||{})},body:body?JSON.stringify(body):undefined}); const j=await r.json().catch(()=>({})); logJson(`${method} ${path} → ${r.status}`,j); if(!r.ok) toast("⚠ "+(j.error||r.status)); return {ok:r.ok,json:j}; }
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

// ---- views ----
function showHome(){ state.view="home"; state.nation=null; $("home").style.display=""; $("nation").style.display="none"; loadMap(); }

// world map (hex, axial)
let MAP=null; const HS=24;
function axialPx(q,r){ return { x:HS*Math.sqrt(3)*(q+r/2), y:HS*1.5*r }; }
function hexPts(cx,cy){ let p=[]; for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i-90); p.push((cx+HS*Math.cos(a)).toFixed(1)+","+(cy+HS*Math.sin(a)).toFixed(1)); } return p.join(" "); }
function neighbors(q,r){ return [[q+1,r],[q-1,r],[q,r+1],[q,r-1],[q+1,r-1],[q-1,r+1]]; }
function hueOf(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))%360; return h; }
function tileOwner(q,r){ return MAP&&MAP.territories?MAP.territories.find(t=>t.q===q&&t.r===r):null; }
async function loadMap(){
  try { MAP=await (await fetch("/map")).json(); } catch(e){ MAP=null; }
  if(!MAP || MAP.error || MAP.cols==null){ toast(MAP&&MAP.error?("지도 로드 실패: "+MAP.error):"지도 로드 실패"); MAP={cols:14,rows:9,territories:[],nations:[]}; }
  renderMap(); renderLegend();
}
function renderMap(){
  if(!MAP) return; const cols=MAP.cols, rows=MAP.rows; const cells=[]; let maxX=0,maxY=0;
  for(let r=0;r<rows;r++) for(let q=0;q<cols;q++){ const {x,y}=axialPx(q,r); const cx=x+HS*2, cy=y+HS*1.3; cells.push({q,r,cx,cy}); maxX=Math.max(maxX,cx); maxY=Math.max(maxY,cy); }
  const svg=$("map"); svg.setAttribute("viewBox",`0 0 ${(maxX+HS*2).toFixed(0)} ${(maxY+HS*1.3).toFixed(0)}`);
  const sel=state.selTile;
  svg.innerHTML=cells.map(c=>{
    const o=tileOwner(c.q,c.r); const fill=o?`hsl(${hueOf(o.nation_id)} 55% 45%)`:"#242430";
    const cls="hex"+(sel&&sel.q===c.q&&sel.r===c.r?" sel":"");
    return `<polygon class="${cls}" points="${hexPts(c.cx,c.cy)}" fill="${fill}" onclick="selectTile(${c.q},${c.r})"/>`;
  }).join("");
}
function renderLegend(){
  const nats=(MAP&&MAP.nations)?MAP.nations:[];
  $("legend").innerHTML=nats.map(n=>`<span class="li"><span class="sw" style="background:hsl(${hueOf(n.id)} 55% 45%)"></span>${n.name}</span>`).join("");
}
function natById(id){ return (MAP.nations||[]).find(n=>n.id===id); }
function myAdjacentNation(q,r){ return (MAP.nations||[]).filter(n=>n.owner_user_id===state.user).map(n=>n.id)
  .find(nid=>neighbors(q,r).some(([nq,nr])=>{ const t=tileOwner(nq,nr); return t&&t.nation_id===nid; })); }
function selectTile(q,r){
  state.selTile={q,r}; renderMap();
  const o=tileOwner(q,r); const panel=$("mappanel");
  if(o){
    const nat=natById(o.nation_id); const army=nat?nat.army:"0"; const mine=o.owner_user_id===state.user;
    let html=`<h3><span style="color:hsl(${hueOf(o.nation_id)} 60% 60%)">■</span> ${o.nation_name}</h3>
      <div class="muted">통치자 ${o.owner_user_id} · 타일 (${q}, ${r})</div>
      <div style="margin:.3rem 0">⚔ 병력 <b>${army}</b></div>
      <button class="p enter" onclick="showNation('${o.nation_id}')">입국 →</button>`;
    if(mine){
      html+=`<div class="muted" style="margin-top:.8rem">군대 모집 (병력 1 = $100)</div>
        <input id="rc_units" value="20" placeholder="병력 수" />
        <button class="p" style="background:var(--accent)" onclick="recruit('${o.nation_id}',${q},${r})">🪖 모집</button>`;
    } else {
      const adj=myAdjacentNation(q,r);
      if(adj){ const myn=natById(adj); const defense=10+Number(army);
        html+=`<div class="muted" style="margin-top:.8rem">⚔ 공격 — 방어력 <b>${defense}</b> (수비10 + 병력${army})</div>
          <div class="muted">공격국 ${myn.name} · 내 병력 ${myn.army}</div>
          <input id="atk_commit" value="${defense+1}" placeholder="투입 병력" />
          <button class="p expand" onclick="attackTile(${q},${r},'${adj}')">⚔ 공격 (병력 소모)</button>`;
      } else {
        html+=`<div class="muted" style="margin-top:.6rem">공격하려면 인접한 내 영토가 필요합니다.</div>`;
      }
    }
    panel.innerHTML=html;
  } else {
    const adj=myAdjacentNation(q,r);
    let html=`<h3>빈 타일 (${q}, ${r})</h3>`;
    if(adj){ const nat=natById(adj); html+=`<button class="p expand" onclick="expandTile(${q},${r},'${adj}')">🚩 ${nat.name} 영토로 확장</button>`; }
    html+=`<div class="muted" style="margin-top:.7rem">여기에 새 국가 건국</div>
      <input id="mf_name" placeholder="국가 이름 (예: 아스트라)" />
      <input id="mf_cur" value="USD" placeholder="통화" />
      <button class="p found" onclick="foundHere(${q},${r})">🏛️ 건국 (초기 국고 지급)</button>`;
    panel.innerHTML=html;
  }
}
async function recruit(nationId,q,r){
  const units=Number($("rc_units").value||"0");
  const {ok,json}=await api("POST","/military/recruit",{nationId,ownerId:state.user,units});
  if(ok){ toast("모집 완료 · 병력 "+json.army); await loadMap(); selectTile(q,r); }
}
async function attackTile(q,r,nationId){
  const commit=Number($("atk_commit").value||"0");
  const {ok,json}=await api("POST","/war/attack",{nationId,ownerId:state.user,q,r,commit});
  if(ok){ toast(json.result==="captured"?"🚩 점령 성공!":"🛡 격퇴됨 (방어력 부족)"); await loadMap(); selectTile(q,r); }
}
async function foundHere(q,r){
  const name=$("mf_name").value.trim(); if(!name) return toast("국가 이름을 입력하세요");
  const cur=($("mf_cur").value||"USD").trim(); const id="n_"+Date.now();
  const {ok}=await api("POST","/nations",{id,name,currency:cur,ownerId:state.user,grantCash:"100000000",capitalQ:q,capitalR:r});
  if(ok){ toast("건국: "+name); showNation(id); }
}
async function expandTile(q,r,nationId){
  const {ok}=await api("POST","/map/claim",{q,r,nationId,ownerId:state.user});
  if(ok){ toast("영토 확장"); await loadMap(); selectTile(q,r); }
}
async function showNation(id){
  state.view="nation"; state.nation=id; state.selected=null;
  $("home").style.display="none"; $("nation").style.display="";
  const d=await (await fetch("/nation?id="+encodeURIComponent(id))).json();
  state.nationInfo=d.nation; state.securities=Array.isArray(d.securities)?d.securities:[];
  $("n_name").textContent=d.nation?d.nation.name:id;
  $("n_meta").textContent=d.nation?`· 통치자 ${d.nation.owner_user_id} · ${d.nation.currency}`:"";
  await renderMarketList();
  if(state.securities[0]) selectSecurity(state.securities[0].id); else clearDetail();
  loadAccount();
}
function clearDetail(){ $("d_tk").textContent="종목 없음"; $("d_type").textContent=""; $("d_price").textContent="—"; $("d_chg").textContent=""; $("d_stats").innerHTML=""; $("chart").innerHTML=""; }

// ---- market list ----
async function renderMarketList(){
  const rows=await Promise.all(state.securities.map(async s=>({s,m:await (await fetch("/market?securityId="+encodeURIComponent(s.id))).json()})));
  const el=$("mlist"); el.innerHTML="";
  if(!rows.length){ el.innerHTML=`<div class="mrow muted" style="cursor:default">아직 상장 종목이 없어요. 아래 운영 도구에서 발행하세요.</div>`; return; }
  rows.forEach(({s,m},i)=>{
    const last=lastPrice(m), chg=changePct(m); const cls=chg>0?"up":chg<0?"down":"muted";
    const div=document.createElement("div"); div.className="mrow"+(state.selected===s.id?" sel":""); div.onclick=()=>selectSecurity(s.id);
    div.innerHTML=`<div class="rk">${i+1}</div><div><span class="tk">${s.ticker}</span><span class="tag">${s.type}</span></div>
      <div class="price num">${last==null?"—":money(last,s.currency)}</div>
      <div class="chg num ${cls}">${chg==null?"":(chg>0?"+":"")+chg.toFixed(2)+"%"}</div>`;
    el.appendChild(div);
  });
}
function lastPrice(m){ if(m&&m.trades&&m.trades.length) return m.trades[0].price; if(m&&m.ammSpot) return m.ammSpot; return null; }
function changePct(m){ if(!m||!m.trades||m.trades.length<2) return null; const last=Number(m.trades[0].price),open=Number(m.trades[m.trades.length-1].price); if(!open) return null; return (last-open)/open*100; }

// ---- detail ----
async function selectSecurity(id){
  state.selected=id; const s=state.securities.find(x=>x.id===id); if(!s) return;
  const m=await (await fetch("/market?securityId="+encodeURIComponent(id))).json();
  state.market=m; state.sec=s;
  $("d_tk").textContent=s.ticker; $("d_type").textContent=s.type;
  const last=lastPrice(m), chg=changePct(m);
  $("d_price").textContent=last==null?"—":money(last,s.currency);
  const c=$("d_chg"); const cls=chg>0?"up":chg<0?"down":"muted"; c.className="dchg num "+cls;
  c.textContent=chg==null?"체결 대기":(chg>0?"▲ ":chg<0?"▼ ":"")+Math.abs(chg).toFixed(2)+"%";
  // stats
  const cap = (last!=null && m.sharesOutstanding)? Math.round(Number(last)*Number(m.sharesOutstanding)) : null;
  $("d_stats").innerHTML=`
    <div class="s"><span class="k">시가총액</span><span class="num">${cap==null?"—":bigMoney(cap,s.currency)}</span></div>
    <div class="s"><span class="k">발행주식</span><span class="num">${m.sharesOutstanding? Number(m.sharesOutstanding).toLocaleString():"—"}</span></div>
    <div class="s"><span class="k">발행자</span><span>${s.issuer_user_id||"—"}</span></div>
    <div class="s"><span class="k">유형</span><span>${s.type}</span></div>`;
  drawChart(m); drawBook(m,s); drawTrades(m,s);
  if(last!=null && document.activeElement!==$("o_price")) $("o_price").value=last;
  calcTotal();
  document.querySelectorAll(".mrow").forEach((e,i)=>{ e.classList.toggle("sel", state.securities[i]&&state.securities[i].id===id); });
}
function setDetTab(t){ state.detTab=t; ["chart","book","trades"].forEach(x=>{ $("pane_"+x).style.display=x===t?"":"none"; $("dt_"+x).className=x===t?"on":""; }); }
function drawChart(m){
  const svg=$("chart"); const t=(m&&m.trades)?[...m.trades].reverse():[];
  if(t.length<2){ svg.innerHTML=`<text x="150" y="78" fill="${getCss('--muted')}" font-size="11" text-anchor="middle">체결 데이터 대기</text>`; return; }
  const ps=t.map(x=>Number(x.price)); const min=Math.min(...ps),max=Math.max(...ps),rng=(max-min)||1;
  const X=i=>(i/(ps.length-1))*300, Y=p=>142-((p-min)/rng)*132;
  const line=ps.map((p,i)=>`${X(i)},${Y(p)}`).join(" ");
  const up=ps[ps.length-1]>=ps[0]; const col=up?getCss("--up"):getCss("--down");
  const area=`0,150 ${line} 300,150`;
  svg.innerHTML=`<polygon points="${area}" fill="${col}" opacity="0.10"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2"/>`;
}
function drawBook(m,s){
  const asks=(m.asks||[]).slice().reverse(), bids=(m.bids||[]);
  $("asks").innerHTML=asks.map(a=>`<div class="lvl ask"><span class="down num">${money(a.price,s.currency)}</span><span class="muted num">${a.quantity}</span></div>`).join("")||`<div class="lvl muted">매도호가 없음</div>`;
  $("bids").innerHTML=bids.map(b=>`<div class="lvl bid"><span class="up num">${money(b.price,s.currency)}</span><span class="muted num">${b.quantity}</span></div>`).join("")||`<div class="lvl muted">매수호가 없음</div>`;
}
function drawTrades(m,s){
  const t=(m.trades||[]).slice(0,20);
  $("trades").innerHTML=t.length? t.map(x=>{ const c=x.taker_side==="buy"?"up":"down"; return `<div class="tr"><span class="${c} num">${money(x.price,s.currency)}</span><span class="muted num">${x.quantity}</span><span class="muted">${x.source}</span></div>`; }).join("") : `<div class="tr muted">체결 없음</div>`;
}

// ---- order ticket ----
function setSide(sd){ state.side=sd; $("tab_buy").className="buy"+(sd==="buy"?" on":""); $("tab_sell").className="sell"+(sd==="sell"?" on":""); const b=$("submit"); b.className="submit "+sd; b.textContent=sd==="buy"?"구매하기":"판매하기"; calcTotal(); }
function setType(t){ state.otype=t; $("seg_limit").className=t==="limit"?"on":""; $("seg_market").className=t==="market"?"on":""; $("pricerow").style.display=t==="market"?"none":"flex"; calcTotal(); }
function calcTotal(){ const price=state.otype==="market"?Number(lastPrice(state.market)||0):Number($("o_price").value||0); const qty=Number($("o_qty").value||0); const cur=state.sec?state.sec.currency:"USD"; $("o_total").textContent=money(Math.round(price*qty),cur); }
function accountCash(){ const cur=state.sec?state.sec.currency:"USD"; const c=state.account&&state.account.cash&&state.account.cash.find(x=>x.currency===cur); return c?Number(c.balance)/100:0; }
function accountPos(id){ const p=state.account&&state.account.positions&&state.account.positions.find(x=>x.security_id===id); return p?Number(p.quantity):0; }
function qpct(f){ const price=Number($("o_price").value||lastPrice(state.market)||0); if(state.side==="buy"){ if(price>0) $("o_qty").value=Math.floor((accountCash()/price)*f*1e6)/1e6; } else { $("o_qty").value=Math.floor(accountPos(state.selected)*f*1e6)/1e6; } calcTotal(); }
async function submitOrder(){
  if(!state.selected) return toast("종목을 선택하세요");
  const body={orderId:"o_"+Date.now(),securityId:state.selected,ownerId:state.user,side:state.side,quantity:String($("o_qty").value||"0")};
  if(state.otype==="limit") body.limitPrice=String($("o_price").value||"0");
  const {ok,json}=await api("POST","/orders",body);
  if(ok){ toast((state.side==="buy"?"매수":"매도")+" 체결 "+(json.filled||"0")); await selectSecurity(state.selected); await loadAccount(); await renderMarketList(); }
}

// ---- account ----
async function loadAccount(){
  const a=await (await fetch("/account?userId="+encodeURIComponent(state.user))).json();
  state.account=a;
  const cur=state.nationInfo?state.nationInfo.currency:(state.sec?state.sec.currency:"USD");
  const cashRow=(a.cash||[]).find(c=>c.currency===cur)||(a.cash||[])[0];
  $("p_cur").textContent=(cashRow?cashRow.currency:cur)+" 현금";
  $("p_net").textContent=cashRow?money(cashRow.balance,cashRow.currency):money(0,cur);
  const byId=Object.fromEntries(state.securities.map(s=>[s.id,s]));
  $("p_positions").innerHTML=(a.positions||[]).length?(a.positions||[]).map(p=>{ const s=byId[p.security_id]; const tk=s?s.ticker:p.security_id;
    return `<div class="pos"><div><b>${tk}</b> <span class="muted num">${p.quantity}</span></div><div class="r"><button style="background:var(--panel2);color:var(--text);padding:.25rem .6rem" onclick="selectSecurity('${p.security_id}')">거래</button></div></div>`; }).join(""):`<div class="pos muted">보유 종목 없음</div>`;
}
function switchUser(){ state.user=$("user").value.trim()||"me"; if(state.view==="nation") loadAccount(); }
async function loadWorld(){ const w=await (await fetch("/world")).json(); if(w&&w.currentTick!=null) $("clock").textContent="tick "+w.currentTick; }

// ---- issuer tools (scoped to current nation) ----
async function tCreateAccount(){ await api("POST","/accounts",{userId:$("t_acc_id").value,currency:state.nationInfo?state.nationInfo.currency:"USD",grantCash:$("t_acc_cash").value}); toast("계정 생성"); loadAccount(); }
async function tIssueEquity(){ await api("POST","/issue/equity",{id:$("t_eq_id").value,ticker:$("t_eq_tk").value,issuerUserId:state.user,currency:state.nationInfo.currency,nationId:state.nation,sharesOutstanding:$("t_eq_sh").value}); toast("발행 완료"); await refreshNation(); }
async function tLiquidity(){ await api("POST","/pools/liquidity",{securityId:$("t_lp_id").value,providerId:state.user,baseIn:$("t_lp_b").value,quoteIn:$("t_lp_q").value}); toast("유동성 예치"); await refreshNation(); }
async function tIssueBond(){ await api("POST","/issue/bond",{id:$("t_bd_id").value,ticker:$("t_bd_tk").value,issuerUserId:state.user,currency:state.nationInfo.currency,nationId:state.nation,faceValue:$("t_bd_face").value,couponRate:$("t_bd_rate").value,maturityTick:Number($("t_bd_mat").value),couponIntervalTicks:Number($("t_bd_ci").value),unitsIssued:$("t_bd_u").value}); toast("채권 발행"); await refreshNation(); }
async function tIssueEtf(){ const c=$("t_etf_c").value.split(",").map(s=>s.trim()).filter(Boolean).map(p=>{const[id,u]=p.split(":");return{securityId:id.trim(),unitsPerShare:(u||"1").trim()};}); await api("POST","/issue/etf",{id:$("t_etf_id").value,ticker:$("t_etf_tk").value,issuerUserId:state.user,currency:state.nationInfo.currency,nationId:state.nation,constituents:c}); toast("ETF 발행"); await refreshNation(); }
async function tDividend(){ await api("POST","/actions/dividend",{securityId:$("t_dv_id").value,issuerId:state.user,perShare:$("t_dv_ps").value}); toast("배당 지급"); loadAccount(); }
async function tSplit(){ await api("POST","/actions/split",{securityId:$("t_dv_id").value,issuerId:state.user,ratio:Number($("t_sp_r").value)}); toast("분할 완료"); await refreshNation(); }
async function tTick(){ await api("POST","/tick",{},{"x-tick-secret":$("t_tick_secret").value}); loadWorld(); }
async function refreshNation(){ const d=await (await fetch("/nation?id="+encodeURIComponent(state.nation))).json(); state.securities=Array.isArray(d.securities)?d.securities:[]; await renderMarketList(); if(state.selected) selectSecurity(state.selected); else if(state.securities[0]) selectSecurity(state.securities[0].id); loadAccount(); }

// ---- boot ----
showHome(); loadWorld();
setInterval(()=>{ loadWorld(); if(state.view==="nation"&&state.selected) selectSecurity(state.selected); }, 7000);
</script>
